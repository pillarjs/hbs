name: ci

on:
- pull_request
- push

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} - Express ${{ matrix.express-version }}
    permissions:
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
        - "18.0.0"
        - "18"
        - "19"
        - "20"
        - "21"
        - "22"
        - "23"
        - "24"
        - "25"
        - "26"
        express-version:
        - "4"
        - "5"

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Node.js dependencies
      run: npm install

    - name: Install Express ${{ matrix.express-version }}
      run: npm install express@${{ matrix.express-version }}

    - name: List environment
      shell: bash
      run: |
        echo "node@$(node -v)"
        echo "npm@$(npm -v)"
        npm list express
        npm -s ls ||:

    - name: Run tests
      run: npm test

    - name: Lint code
      if: matrix.node-version >= '22'
      run: npm run lint
